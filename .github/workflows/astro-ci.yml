name: astro-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # A step of build, not a job of its own: it needs the same dist the build
      # just produced, and folding it in keeps the required checks at three.
      - name: Titles and meta descriptions within Bing's limits
        run: npm run check:meta
        working-directory: site
      # lychee does not cover llms.txt: it reads the HTML, and our own domain is
      # excluded from it. Nothing else links these URLs, so a renamed route
      # would rot the file silently.
      - name: llms.txt links point at routes that exist
        run: npm run check:llms
        working-directory: site
      # Astro's markdown SmartyPants is on by default and rewrites straight
      # apostrophes into curly ones between src and dist. astro.config.mjs turns
      # it off; this catches a dependency bump that turns it back on.
      - name: No curly quotes or em dashes in the build output
        run: npm run check:text
        working-directory: site

  # The gitleaks scanner itself, not gitleaks/gitleaks-action. The action needs
  # a licence key for organisation-owned repositories, held as a repository
  # secret, and pull requests opened by Dependabot cannot read Actions secrets,
  # so the check failed on every Dependabot pull request. The scanner needs no
  # key and no secrets. The job keeps the name gitleaks because that name is a
  # required status check on main. Bump the version and checksum together,
  # taking the checksum from the release's checksums file.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks, checksum verified
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      # Scans every commit reachable from the checked-out ref, which for a pull
      # request is the merge of the branch into main. Exits 1 on any finding.
      - name: Scan git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: lycheeverse/lychee-action@v1
        with:
          # These excludes are load-bearing; do not remove.
          # okarthur.com: our own canonical/og:url tags point at the live site.
          #   A page added in a PR does not exist there until merge and deploy,
          #   so lychee 404s on its own canonical tag. Do not drop this again —
          #   it was removed once (9eb5392) on the mistaken belief it was
          #   obsolete, which broke the very next PR that added a page.
          # linkedin.com: LinkedIn blocks automated clients, answering 999 from
          #   some IPs and 403/429 from GitHub runners. The latter counts as an
          #   error, so leaving it in makes this required check fail at random.
          # open.spotify.com, de.bentley.com, ice.org.uk and emerald.com: same
          #   anti-bot behaviour against GitHub runners. The linked works are
          #   verified by hand.
          # External links other than these are still checked.
          args: --no-progress --exclude '^https://okarthur\.com' --exclude 'linkedin\.com' --exclude 'open\.spotify\.com' --exclude 'de\.bentley\.com' --exclude 'ice\.org\.uk' --exclude 'emerald\.com' site/dist
          format: json
          output: lychee/out.json
          fail: false
      - name: Fail on broken links (timeouts are not fatal)
        run: |
          errors=$(jq '.errors' lychee/out.json)
          echo "lychee non-timeout errors: $errors"
          test "$errors" -eq 0
