name: astro-ci
on:
  pull_request:
  push:
    branches: [main]
  # Once a month on main, so a link that has rotted or a host that has started
  # refusing runners shows up without waiting for the next change. The time is
  # off the hour because scheduled runs on the hour queue behind everyone
  # else's. A manual run is available from the Actions tab.
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

# Every job reads the repository and nothing else. Set here so the jobs do not
# depend on the repository's default token setting, whatever that is.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # A step of build, not a job of its own: it needs the same dist the build
      # just produced, and folding it in keeps the required checks at three.
      - name: Titles and meta descriptions within Bing's limits
        run: npm run check:meta
        working-directory: site
      # lychee does not cover llms.txt: it reads the HTML, and our own domain is
      # excluded from it. Nothing else links these URLs, so a renamed route
      # would rot the file silently.
      - name: llms.txt links point at routes that exist
        run: npm run check:llms
        working-directory: site
      # Astro's markdown SmartyPants is on by default and rewrites straight
      # apostrophes into curly ones between src and dist. astro.config.mjs turns
      # it off; this catches a dependency bump that turns it back on.
      - name: No curly quotes or em dashes in the build output
        run: npm run check:text
        working-directory: site
      # The page copy was rewritten to match the register of Steven's own notes,
      # full sentences and few contrasts. This counts fragments of four words
      # or fewer and uses of "rather than" per page, and fails above the limits
      # set in the script. Individual notes are not checked.
      - name: Page copy within the voice limits
        run: npm run check:voice
        working-directory: site

  # The gitleaks scanner itself, not gitleaks/gitleaks-action. The action needs
  # a licence key for organisation-owned repositories, held as a repository
  # secret, and pull requests opened by Dependabot cannot read Actions secrets,
  # so the check failed on every Dependabot pull request. The scanner needs no
  # key and no secrets. The job keeps the name gitleaks because that name is a
  # required status check on main. Bump the version and checksum together,
  # taking the checksum from the release's checksums file.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks, checksum verified
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      # Scans every commit reachable from the checked-out ref, which for a pull
      # request is the merge of the branch into main. Exits 1 on any finding.
      - name: Scan git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # Pinned to the commit behind v1.10.0, not the movable v1 tag, so a
      # compromised tag cannot change what runs here. Dependabot updates the
      # pin and the comment together.
      - uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          # These excludes are load-bearing; do not remove.
          # okarthur.com: our own canonical/og:url tags point at the live site.
          #   A page added in a PR does not exist there until merge and deploy,
          #   so lychee 404s on its own canonical tag. Do not drop this again —
          #   it was removed once (9eb5392) on the mistaken belief it was
          #   obsolete, which broke the very next PR that added a page.
          # linkedin.com: LinkedIn blocks automated clients, answering 999 from
          #   some IPs and 403/429 from GitHub runners. The latter counts as an
          #   error, so leaving it in makes this required check fail at random.
          # open.spotify.com, de.bentley.com, ice.org.uk and emerald.com: same
          #   anti-bot behaviour against GitHub runners. The linked works are
          #   verified by hand.
          # newcivilengineer.com: answers 403 to runners some of the time and
          #   200 to a browser. It caused the one-off failures after #93 and
          #   #97, and the named-link report below caught it on 26 October.
          # External links other than these are still checked.
          # Retries and a longer timeout absorb the brief refusals runners get
          # from some hosts. Two runs failed once and passed on re-run, after
          # #93 and #97, with every link answering normally from a browser.
          args: --no-progress --max-retries 4 --retry-wait-time 5 --timeout 30 --exclude '^https://okarthur\.com' --exclude 'linkedin\.com' --exclude 'open\.spotify\.com' --exclude 'de\.bentley\.com' --exclude 'ice\.org\.uk' --exclude 'emerald\.com' --exclude 'newcivilengineer\.com' site/dist
          format: json
          output: lychee/out.json
          fail: false
      # Names every failing link as an annotation and in the job summary, so a
      # failure says which host to look at without opening the raw log. A
      # report that is not JSON means lychee crashed, which is said plainly.
      - name: Fail on broken links (timeouts are not fatal)
        run: |
          set -euo pipefail
          report=lychee/out.json
          if ! jq -e . "$report" >/dev/null 2>&1; then
            echo "::error title=linkcheck::lychee wrote no JSON report and may have crashed. See the lychee step above."
            exit 1
          fi
          errors=$(jq '.errors' "$report")
          timeouts=$(jq '.timeouts' "$report")
          echo "lychee non-timeout errors: $errors, timeouts: $timeouts"
          jq -r '.fail_map | to_entries[] | .key as $page | .value[] | [$page, .url, (.status.code // "-" | tostring), .status.text] | @tsv' "$report" > lychee/failures.tsv
          if [ -s lychee/failures.tsv ]; then
            {
              echo "### Links that failed"
              echo
              echo "| Page | Link | Code | Error |"
              echo "| --- | --- | --- | --- |"
              awk -F '\t' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }' lychee/failures.tsv
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS=$'\t' read -r page url code text; do
              echo "::warning title=Link failed::$url ($code, $text) on $page"
            done < lychee/failures.tsv
          fi
          test "$errors" -eq 0
